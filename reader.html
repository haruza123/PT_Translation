<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Reader — PT Prajurit Translation" />
    <title>Reader — PT Prajurit Translation</title>
    <link rel="icon" href="image/PT.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/analytics.js" defer></script>
  </head>
  <body data-page="reader">
    <a class="skip-link" href="#main">Langsung ke konten</a>

    <header class="site-header" data-elevate>
      <div class="container nav">
        <a
          class="brand"
          href="index.html#home"
          aria-label="PT Prajurit Translation"
        >
          <span class="brand__mark" aria-hidden="true">PT</span>
          <span class="brand__text">Prajurit Translation</span>
        </a>

        <button
          class="nav__toggle"
          type="button"
          aria-label="Buka menu"
          aria-expanded="false"
          aria-controls="nav-menu"
          data-nav-toggle
        >
          <span class="nav__toggle-bar" aria-hidden="true"></span>
          <span class="nav__toggle-bar" aria-hidden="true"></span>
        </button>

        <nav class="nav__menu" id="nav-menu" aria-label="Utama" data-nav-menu>
          <a class="nav__link" href="index.html#home">Home</a>
          <a class="nav__link" href="index.html#manga">Manga</a>
          <a class="nav__link" href="translator.html">Translator</a>
          <a class="nav__link" href="genre.html">Genre</a>
          <a class="nav__link" href="series.html">Series</a>
        </nav>

        <div class="nav__search" data-search-wrap>
          <label class="visually-hidden" for="global-search">Cari manga</label>
          <input
            id="global-search"
            class="input input--search"
            type="search"
            placeholder="Cari manga…"
            autocomplete="off"
            spellcheck="false"
            data-global-search
          />
          <div
            class="suggest"
            id="search-suggest"
            role="listbox"
            aria-label="Saran pencarian"
          ></div>
        </div>
      </div>
    </header>

    <main id="main" class="reader">
      <section class="reader__head">
        <div class="container reader__head-inner">
          <a class="back" href="index.html#manga" id="reader-back">← Kembali</a>

          <div class="reader__head-row">
            <div class="reader__head-text">
              <h1 class="reader__title" id="reader-title">Reader</h1>
              <p class="reader__meta" id="reader-meta"></p>
            </div>
          </div>
        </div>
      </section>

      <section
        class="container reader__pages"
        id="reader-pages"
        aria-label="Halaman manga"
      ></section>

      <!-- Floating Reader Bar -->
      <div class="reader-bar" id="reader-bar">
        <div class="reader-bar__inner">
          <a class="btn btn--chip reader-bar__back" href="#" id="bar-back"
            >← Kembali</a
          >

          <div class="reader-bar__chapter-wrap">
            <label class="visually-hidden" for="bar-chapter">Pilih chapter</label>
            <select class="select reader-bar__chapter" id="bar-chapter"></select>
          </div>

          <div class="reader-bar__actions">
            <div class="reader-bar__counter" id="bar-counter" aria-live="polite">
              1 / 1
            </div>
            <div class="reader-bar__settings-wrap">
              <button
                class="reader-bar__gear"
                type="button"
                id="btn-reader-settings"
                aria-label="Pengaturan baca"
                aria-expanded="false"
                aria-haspopup="dialog"
                aria-controls="reader-settings-modal"
              >
                <span class="reader-bar__gear-icon" aria-hidden="true">⚙</span>
              </button>

              <div
                class="settings-modal"
                id="reader-settings-modal"
                role="dialog"
                aria-modal="true"
                aria-labelledby="reader-settings-title"
                tabindex="-1"
              >
                <h2 class="settings-modal__title" id="reader-settings-title">
                  Pengaturan baca
                </h2>

                <div class="settings-group">
                  <label for="setting-direction">Arah baca</label>
                  <select class="select" id="setting-direction">
                    <option value="vertical">Vertikal (gulir)</option>
                    <option value="horizontal">Horizontal (geser kiri-kanan)</option>
                  </select>
                </div>
                <div class="settings-group">
                  <label for="setting-fit">Skala halaman</label>
                  <select class="select" id="setting-fit">
                    <option value="width">Sesuai lebar layar</option>
                    <option value="height">Sesuai tinggi layar</option>
                  </select>
                </div>
                <div class="settings-group">
                  <label for="setting-gap">Jarak antar halaman</label>
                  <select class="select" id="setting-gap">
                    <option value="none">Tanpa jarak</option>
                    <option value="normal">Sedang</option>
                    <option value="wide">Lebar</option>
                  </select>
                </div>
                <div class="settings-group">
                  <label for="setting-brightness">
                    Kecerahan
                    <span class="settings-group__value" id="setting-brightness-val"
                      >100%</span
                    >
                  </label>
                  <input
                    class="settings-range"
                    type="range"
                    id="setting-brightness"
                    min="60"
                    max="100"
                    value="100"
                    step="1"
                  />
                </div>
                <div class="settings-group settings-group--row">
                  <input type="checkbox" id="setting-hide-bar" />
                  <label for="setting-hide-bar">Sembunyikan bilah saat scroll ke bawah</label>
                </div>

                <div class="settings-modal__footer">
                  <button
                    class="btn btn--ghost"
                    type="button"
                    id="reader-settings-reset"
                  >
                    Atur ulang
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div
        class="reader-settings-scrim"
        id="reader-settings-scrim"
        hidden
        aria-hidden="true"
      ></div>
    </main>

    <footer class="footer">
      <div class="container footer__inner">
        <p class="footer__copy">
          © <span id="year"></span> PT Prajurit Translation
        </p>
        <p class="footer__meta">
          Multi-translator platform • Vanilla HTML/CSS/JS
        </p>
      </div>
    </footer>

    <script src="js/security.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/detail.js" defer></script>
  </body>
</html>
